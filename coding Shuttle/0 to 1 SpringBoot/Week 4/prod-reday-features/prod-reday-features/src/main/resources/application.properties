spring.application.name=prod-reday-features
spring.datasource.url= jdbc:mysql://localhost:3306/prodRedayFeatures
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8000

employeService.base.url= http://localhost:8080/employee/

# set the Log level for the Specifice package we can set it too the entire application 
#logging.level.com.codingshuttle.prod_reday_features.prod_reday_features.clients= DEBUG
#logging.level.root = trace

#logging pattern 
logging.pattern.console= %d [%c]  ---%m%n

# logging file
logging.file.name=application.log


#Actuactor Configuractions 
management.endpoints.web.exposure.include=*

management.info.env.enabled=true
info.app.author=Tejas Gopale 
info.app.version=1.0.0
info.app.documentationLink = http:localhost/prod-reday-features
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

#Swager Api and Open Api
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
 